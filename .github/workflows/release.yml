name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest }
          - { target: x86_64-apple-darwin,       os: macos-latest }
          - { target: aarch64-apple-darwin,      os: macos-latest }
    steps:
      - uses: actions/checkout@v4

      # Handles musl toolchains and cross linkers for the aarch64 target.
      - uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --locked

      - name: Package
        shell: bash
        run: |
          cd "target/${{ matrix.target }}/release"
          tar -czf "$GITHUB_WORKSPACE/treeview-${{ matrix.target }}.tar.gz" treeview

      # Published beside the archive so install.sh can verify what it downloaded.
      # `shasum` is present on Linux and macOS runners alike.
      - name: Checksum
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          shasum -a 256 "treeview-${{ matrix.target }}.tar.gz" \
            > "treeview-${{ matrix.target }}.tar.gz.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            treeview-${{ matrix.target }}.tar.gz
            treeview-${{ matrix.target }}.tar.gz.sha256
          generate_release_notes: true
