name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # --locked everywhere: a Cargo.toml/Cargo.lock drift used to pass CI and
      # only fail in the release build, after the tag was already public.
      - run: cargo test --all-targets --locked
      - run: cargo build --release --locked

  # The shipped artifact class: static musl. Built here so a regression is caught
  # in a pull request instead of on an Alpine user's first run.
  musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Assert the binary is static
        run: |
          file target/x86_64-unknown-linux-musl/release/treeview
          ! file target/x86_64-unknown-linux-musl/release/treeview | grep -q "dynamically linked"

  # install.sh is the only install path, and it is served live from main.
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: shellcheck --version
      - run: shellcheck install.sh
