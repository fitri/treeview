[package]
name = "treeview"
version = "0.1.0"
edition = "2024"
description = "Two-pane terminal file explorer"
license = "MIT"
rust-version = "1.88"
keywords = ["tui", "file-manager", "terminal", "ratatui", "treeview"]
categories = ["command-line-utilities"]
repository = "https://github.com/fitri/treeview"
documentation = "https://docs.rs/treeview"
homepage = "https://fitri.github.io/treeview/"
readme = "README.md"
exclude = ["docs/**", ".github/**", "PLAN.md"]

[lib]
name = "treeview"
path = "src/lib.rs"

[[bin]]
name = "treeview"
path = "src/main.rs"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
unicode-width = "0.2"

[dependencies]
# Only crossterm: we use no calendar, macros, underline-color or layout cache.
# Drops 8 crates from the graph and roughly halves a cold build.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
unicode-width = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
